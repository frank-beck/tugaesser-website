<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- Liegt im Webroot mit, ist aber keine Seite für Besucher. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="fonts/public-sans.css" />
    <style>
      /*
        Vorlage für images/og-image.jpg — generate-og.mjs fotografiert sie auf
        exakt 1200×630 ab. Aufbau wie der Auftakt der Seite (seit 30.09.2026):
        Text links auf Tiefblau, rechts ein Standbild der Zapfanlage.

        Bild: `images/og-zapfanlage.jpg`, Sekunde 3 aus video/zapfanlage.mp4 —
        ohne das Lindr-Logo (Sekunde 0–1) und ohne Kreideschrift fremder Biere.
        Keine Live-Zahl: das Bild wird tagelang gecacht und veraltete sonst.
      */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }

      body {
        display: grid;
        grid-template-columns: 780px 420px;
        background: #001a33;
        font-family: 'Public Sans', system-ui, sans-serif;
        color: #fff;
      }

      .text {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 56px 64px 52px;
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 17px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.8);
      }
      .kicker i { width: 32px; height: 4px; border-radius: 2px; background: currentColor; }

      /* Längste Zeile „Für Heilbronn.“ ist 8,4 × Schriftgröße breit: 76 px → 638 von 652. */
      h1 {
        font-size: 76px;
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.025em;
        text-transform: uppercase;
      }
      h1 span { display: block; }
      h1 .leise { color: rgba(255, 255, 255, 0.55); }

      .satz {
        margin-top: 22px;
        font-size: 25px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.85);
      }
      .satz b { font-weight: 900; color: #fff; }

      .fuss {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .marke {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .marke img { width: 40px; height: 40px; }
      .knopf {
        border-radius: 8px;
        background: #7a1618;
        padding: 14px 26px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25);
      }

      .bild {
        background: url('images/og-zapfanlage.jpg') center 45% / cover no-repeat;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="kicker"><i></i>Tugässer · Heilbronn</p>
      <div>
        <h1>
          <span>Ein Bier aus</span>
          <span>Heilbronn.</span>
          <span class="leise">Für Heilbronn.</span>
        </h1>
        <p class="satz"><b>Kein Konzern, kein Chef.</b><br />Wer mitmacht, entscheidet mit.</p>
      </div>
      <div class="fuss">
        <span class="marke"><img src="images/tugaesser-bildmarke-weiss.png" alt="" />tugaesser.de</span>
        <span class="knopf">Mach mit</span>
      </div>
    </div>
    <div class="bild"></div>
  </body>
</html>
