name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur die Rechte, die das Deploy braucht.
permissions:
  contents: read
  pages: write
  id-token: write

# Laufendes Deploy nicht abbrechen, aber nur eines gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Puppeteer ist reines Entwicklerwerkzeug (Screenshots) – ohne diesen
      # Schalter lädt npm im CI grundlos einen kompletten Chromium.
      - name: Abhängigkeiten installieren
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Frisch bauen statt der committeten Datei vertrauen: sonst geht eine
      # vergessene Klasse unbemerkt live. Der postbuild-Hook setzt dabei den
      # Cache-Bust in index.html.
      - name: Tailwind bauen
        run: npm run build:css

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html tailwind.css _site/
          cp -R images _site/
          # Verhindert, dass GitHub die Dateien durch Jekyll schickt.
          touch _site/.nojekyll
          # Trägt die Custom Domain – ohne diese Datei verliert Pages die
          # Einstellung bei jedem Deploy wieder.
          if [ -f CNAME ]; then cp CNAME _site/; fi
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
